name: ci

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secretlint (working tree)
        run: npm run secrets:scan
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks (git history)
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: secrets
    steps:
      - name: Checkout extensions
        uses: actions/checkout@v5
        with:
          path: executioncontrolprotocol-extensions
      - name: Checkout core (peer deps via file:)
        uses: actions/checkout@v5
        with:
          repository: GuillaumeCleme/executioncontrolprotocol
          path: executioncontrolprotocol
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: executioncontrolprotocol-extensions/package-lock.json
      - name: Install and check
        working-directory: executioncontrolprotocol-extensions
        run: |
          npm ci
          npm run check

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [secrets, check]
    permissions:
      contents: read
    steps:
      - name: Checkout extensions
        uses: actions/checkout@v5
        with:
          path: executioncontrolprotocol-extensions
      - name: Checkout core (peer deps via file:)
        uses: actions/checkout@v5
        with:
          repository: GuillaumeCleme/executioncontrolprotocol
          path: executioncontrolprotocol
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: executioncontrolprotocol-extensions/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Build and publish
        working-directory: executioncontrolprotocol-extensions
        run: |
          npm ci
          npm run build
          npm run publish:workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
