name: ci

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: extensions
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/pnpm-lock.yaml
      - working-directory: extensions
        run: pnpm install --frozen-lockfile
      - name: Secretlint (working tree)
        working-directory: extensions
        run: pnpm run secrets:scan
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks (git history)
        working-directory: extensions
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: secrets
    steps:
      - name: Checkout extensions
        uses: actions/checkout@v5
        with:
          path: extensions
      - name: Checkout core (development track only)
        if: github.ref != 'refs/heads/main' && github.base_ref != 'main'
        uses: actions/checkout@v5
        with:
          repository: executioncontrolprotocol/executioncontrolprotocol
          ref: development
          path: executioncontrolprotocol
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/pnpm-lock.yaml
      - name: Setup dependencies (two-track)
        working-directory: extensions
        env:
          ECP_ROOT: ${{ github.workspace }}/executioncontrolprotocol
          CI_LINK_PACKAGES: "@executioncontrolprotocol/core,@executioncontrolprotocol/types"
        run: pnpm run ci:setup
      - name: Build
        working-directory: extensions
        run: pnpm run build
      - name: "Forbid file: package links"
        working-directory: extensions
        run: pnpm run check:no-file-deps
      - name: Lint
        working-directory: extensions
        run: pnpm run lint
      - name: Test
        working-directory: extensions
        run: pnpm run test

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [secrets, check]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: extensions
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - name: Install from registry (main track)
        working-directory: extensions
        env:
          CI_LINK_PACKAGES: ""
        run: pnpm run ci:setup
      - name: Build and publish extensions
        working-directory: extensions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm run build
          pnpm run publish:workspaces
